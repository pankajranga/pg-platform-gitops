apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: pg-connect-cluster
  namespace: kafka
  annotations:
    # Required so Strimzi will watch for KafkaConnector resources targeting this Connect cluster
    strimzi.io/use-connector-resources: "true"
spec:
  # Using Strimzi's build feature: starts from Strimzi's own compatible base image
  # and layers Debezium's connector plugin on top - this is the actually-supported
  # pattern (a foreign pre-built Debezium image is NOT compatible with Strimzi's
  # KafkaConnect operator, confirmed the hard way today).
  build:
    output:
      type: docker
      image: us-central1-docker.pkg.dev/projectdemo-501114/kafka-connect-images/pg-connect:latest
      pushSecret: ar-push-secret
    plugins:
      - name: debezium-postgres-connector
        artifacts:
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/3.5.0.Final/debezium-connector-postgres-3.5.0.Final-plugin.tar.gz
  replicas: 1
  bootstrapServers: pg-platform-kafka-kafka-bootstrap:9092
  groupId: pg-connect-cluster
  offsetStorageTopic: connect-offsets
  configStorageTopic: connect-configs
  statusStorageTopic: connect-status
  config:
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
  resources:
    requests:
      cpu: "0.5"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "1536Mi"